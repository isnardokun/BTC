[project]
name = "bitcoin-quant-research-lab"
version = "0.1.0"
description = "Autonomous Bitcoin pivot research, backtesting and AI experimentation laboratory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "polars>=1.32",
  "duckdb>=1.3",
  "numpy>=2.2",
  "python-dotenv>=1.1",
  "typer>=0.16",
  "rich>=14.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12"]

[project.scripts]
bqrl = "btc_quant_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_quant_lab"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
