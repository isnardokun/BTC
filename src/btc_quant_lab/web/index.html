<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitcoin Quant Research Lab</title><script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script><style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#121722;--muted:#8992a3;--line:#252d3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8edf5;font-family:Inter,system-ui,sans-serif}header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}header h1{font-size:16px;margin:0}button,select{background:#171e2b;color:#e8edf5;border:1px solid #30394a;border-radius:6px;padding:7px 9px}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 410px;height:calc(100vh - 58px)}#chart{min-width:0}aside{overflow:auto;border-left:1px solid var(--line);padding:12px;background:var(--panel)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #202735;padding:5px 0}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:5px;border-bottom:1px solid #222a37;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:var(--muted);font-size:12px}pre{white-space:pre-wrap;font-size:11px}</style></head>
<body><header><h1>Bitcoin Quant Research Lab</h1><button onclick="syncData()">Sync BTC</button><button onclick="loadChart()">Actualizar</button><button onclick="runOptimize()">Optimizar</button><button onclick="runAI()">IA: experimento</button></header>
<main><div id="chart"></div><aside><div class="controls"><select id="motor"><option>M1</option><option>M3</option></select><select id="range"><option>R8</option><option>R7</option><option>R4</option></select><select id="minbars"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><select id="pending"><option>0</option><option selected>3</option><option>5</option><option>8</option></select></div><div class="card"><b>Métricas</b><div id="metrics"></div></div><div class="card"><b>Ranking</b><div id="ranking" class="muted">Ejecuta Optimizar.</div></div><div class="card"><b>Agente IA</b><pre id="ai" class="muted">MiniMax es opcional.</pre></div></aside></main>
<script>
const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#0b0e14'},textColor:'#c7d0df'},grid:{vertLines:{color:'#151b25'},horzLines:{color:'#151b25'}},timeScale:{timeVisible:true,borderColor:'#30394a'},rightPriceScale:{borderColor:'#30394a'}});const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
async function loadChart(){const q=new URLSearchParams({motor:motor.value,range_mode:range.value,min_bars:minbars.value,max_pending:pending.value});const r=await fetch('/api/chart?'+q),d=await r.json();if(!r.ok){document.getElementById('metrics').innerHTML='<span class="muted">'+(d.detail||'Sin datos. Pulsa Sync BTC.')+'</span>';return}candles.setData(d.candles);const markers=d.pivots.map(p=>({time:p.time,position:p.direction===1?'belowBar':'aboveBar',color:p.direction===1?'#f3c74f':'#ffffff',shape:p.direction===1?'arrowUp':'arrowDown',text:p.direction===1?'Pivot A':'Pivot B'}));LightweightCharts.createSeriesMarkers(candles,markers);chart.timeScale().fitContent();document.getElementById('metrics').innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v??'—'}</b></div>`).join('')}
async function syncData(){const r=await fetch('/api/sync',{method:'POST'}),d=await r.json();alert(JSON.stringify(d));await loadChart()}
async function runOptimize(){ranking.innerHTML='Calculando...';const r=await fetch('/api/optimize',{method:'POST'}),d=await r.json();ranking.innerHTML='<table><tr><th>#</th><th>Config</th><th>Trades</th><th>Net%</th><th>Exp%</th><th>PF</th><th>DD</th></tr>'+d.rows.slice(0,15).map((x,i)=>`<tr><td>${i+1}</td><td>${x.config.motor}/${x.config.range_mode}/${x.config.min_bars}/${x.config.max_pending}</td><td>${x.trades}</td><td>${x.net_return_pct.toFixed(2)}</td><td>${x.expectancy_pct?.toFixed(3)??'—'}</td><td>${x.profit_factor?.toFixed(2)??'—'}</td><td>${x.max_drawdown_pct.toFixed(2)}</td></tr>`).join('')+'</table>'}
async function runAI(){ai.textContent='Pensando...';const r=await fetch('/api/ai/iterate',{method:'POST'}),d=await r.json();ai.textContent=JSON.stringify(d,null,2)}loadChart();setInterval(()=>loadChart().catch(()=>{}),60000);
</script></body></html>
